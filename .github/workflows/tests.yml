name: UI and DB Tests

on:
  push:
    paths:
      - 'ui/**'          # Triggers on any change in UI/Tabs/Core
      - 'tests/**'       # Triggers on any change in tests
      - '.github/workflows/test.yaml'
  pull_request:
    paths:
      - 'ui/**'
      - 'tests/**'
      - '.github/workflows/test.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    # ... (Keep your existing Postgres service block here)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest sqlalchemy psycopg2-binary pandas  # Added pandas for your validator
      
      - name: Run Tests
        env:
          DATABASE_URL: postgresql://omni:omnipass@localhost:5432/omnidb
        run: |
          python ui/core/init_db.py
          pytest tests/  # Runs everything in the tests folder