name: FungalFlow CI

on:
  push:
    branches: [ main, dev, 'fix/**', 'feature/**', 'test-fungalflow' ]
    paths:
      - 'nextflow/fungalflow/**'
      - 'nextflow/modules/local/fungalflow/**'
      - 'nextflow/modules/local/shared/**'
      - 'nextflow/subworkflows/local/fungalflow/**'
      - 'nextflow/subworkflows/local/shared/**'
      - 'nextflow/modules/nf-core/**'
      - 'nextflow/nextflow.config'
      - '.github/workflows/fungalflow_ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'nextflow/fungalflow/**'
      - 'nextflow/modules/local/fungalflow/**'
      - 'nextflow/modules/local/shared/**'

jobs:

  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
        with:
          version: "25.10.4"
      - name: Check main.nf parses
        run: |
          nextflow run nextflow/fungalflow/main.nf \
            -preview \
            --shortreads 'NO_FILE_{R1,R2}.fastq.gz' \
            --sample_id 'syntax_check' \
            --base_outdir 'results_ci' \
            -profile fungal_env \
            2>&1 || true
          echo "Syntax check complete"

  stub_illumina:
    name: Stub — Illumina short reads
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
        with:
          version: "25.10.4"
      - name: Create stub test data
        run: |
          mkdir -p test_data
          printf '@r1\nACGT\n+\nIIII\n' | gzip \
            > test_data/aspergillus_niger_illumina_R1.fastq.gz
          printf '@r1\nACGT\n+\nIIII\n' | gzip \
            > test_data/aspergillus_niger_illumina_R2.fastq.gz
      - name: FungalFlow stub — Illumina
        run: |
          nextflow run nextflow/fungalflow/main.nf \
            -stub-run \
            --shortreads 'test_data/aspergillus_niger_illumina_{R1,R2}.fastq.gz' \
            --sample_id 'ci_niger' \
            --base_outdir 'results_ci' \
            -profile fungal_env
          echo "Exit code: $?"
      - name: Check outputs
        run: |
          SUCCEEDED=$(find work/ -name ".exitcode" 2>/dev/null \
            | xargs grep -l "^0$" 2>/dev/null | wc -l | tr -d " ")
          echo "Processes succeeded: $SUCCEEDED"
          [ "${SUCCEEDED}" -gt 0 ] || (echo "ERROR: no processes ran" && exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fungalflow-stub-illumina
          path: work/
          retention-days: 3

  stub_ont:
    name: Stub — ONT long reads
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
        with:
          version: "25.10.4"
      - name: Create stub test data
        run: |
          mkdir -p test_data
          printf '@r1\nACGTACGTACGT\n+\nIIIIIIIIIIII\n' | gzip \
            > test_data/aspergillus_fumigatus_ont.fastq.gz
      - name: FungalFlow stub — ONT
        run: |
          nextflow run nextflow/fungalflow/main.nf \
            -stub-run \
            --longreads 'test_data/aspergillus_fumigatus_ont.fastq.gz' \
            --sample_id 'ci_fumigatus' \
            --base_outdir 'results_ci' \
            -profile fungal_env
          echo "Exit code: $?"
      - name: Check outputs
        run: |
          SUCCEEDED=$(find work/ -name ".exitcode" 2>/dev/null \
            | xargs grep -l "^0$" 2>/dev/null | wc -l | tr -d " ")
          echo "Processes succeeded: $SUCCEEDED"
          [ "${SUCCEEDED}" -gt 0 ] || (echo "ERROR: no processes ran" && exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fungalflow-stub-ont
          path: work/
          retention-days: 3

  stub_hybrid:
    name: Stub — Hybrid (Illumina + ONT)
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
        with:
          version: "25.10.4"
      - name: Create stub test data
        run: |
          mkdir -p test_data
          printf '@r1\nACGT\n+\nIIII\n' | gzip > test_data/hybrid_R1.fastq.gz
          printf '@r1\nACGT\n+\nIIII\n' | gzip > test_data/hybrid_R2.fastq.gz
          printf '@r1\nACGTACGT\n+\nIIIIIIII\n' | gzip \
            > test_data/hybrid_ont.fastq.gz
      - name: FungalFlow stub — Hybrid
        run: |
          nextflow run nextflow/fungalflow/main.nf \
            -stub-run \
            --shortreads 'test_data/hybrid_{R1,R2}.fastq.gz' \
            --longreads 'test_data/hybrid_ont.fastq.gz' \
            --sample_id 'ci_hybrid' \
            --base_outdir 'results_ci' \
            -profile fungal_env
          echo "Exit code: $?"
      - name: Check outputs
        run: |
          SUCCEEDED=$(find work/ -name ".exitcode" 2>/dev/null \
            | xargs grep -l "^0$" 2>/dev/null | wc -l | tr -d " ")
          echo "Processes succeeded: $SUCCEEDED"
          [ "${SUCCEEDED}" -gt 0 ] || (echo "ERROR: no processes ran" && exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fungalflow-stub-hybrid
          path: work/
          retention-days: 3
