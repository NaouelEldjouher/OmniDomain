name: FungalFlow CI
 
on:
  push:
    branches: [ main, dev, 'fix/**', 'feature/**', 'test-fungalflow' ]
    paths:
      - 'nextflow/fungalflow/**'
      - 'nextflow/modules/local/fungalflow/**'
      - 'nextflow/modules/local/shared/**'
      - 'nextflow/subworkflows/local/fungalflow/**'
      - 'nextflow/subworkflows/local/shared/**'
      - 'nextflow/nextflow.config'
      - '.github/workflows/fungalflow_ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'nextflow/fungalflow/**'
      - 'nextflow/modules/local/fungalflow/**'
      - 'nextflow/modules/local/shared/**'
 
jobs:
 
  # ── Job 1: Syntax check ────────────────────────────────────────────────────
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ">=23.04.0"
 
      - name: Check main.nf parses without error
        run: |
          # -preview parses the DAG without executing any process
          nextflow run nextflow/fungalflow/main.nf \
            -preview \
            --shortreads 'NO_FILE_{R1,R2}.fastq.gz' \
            --sample_id 'syntax_check' \
            --base_outdir 'results_ci' \
            -profile fungal_env \
            2>&1 || true
          echo "Syntax check complete"
 
  # ── Job 2: Stub run — short reads (Illumina) ──────────────────────────────
  stub_illumina:
    name: Stub — Illumina short reads
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
 
      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ">=23.04.0"
 
      - name: Create stub test data
        run: |
          mkdir -p test_data
          # Create minimal fake FASTQ files for stub run
          printf '@read1\nACGT\n+\nIIII\n' | gzip > test_data/aspergillus_niger_illumina_R1.fastq.gz
          printf '@read1\nACGT\n+\nIIII\n' | gzip > test_data/aspergillus_niger_illumina_R2.fastq.gz
 
      - name: FungalFlow stub — Illumina mode
        run: |
          nextflow run nextflow/fungalflow/main.nf \
            -stub-run \
            --shortreads 'test_data/aspergillus_niger_illumina_{R1,R2}.fastq.gz' \
            --sample_id 'ci_niger_illumina' \
            --base_outdir 'results_ci' \
            -profile fungal_env \
            2>&1 | tail -30
 
      - name: Validate outputs exist
        run: |
          find results_ci/ -type f 2>/dev/null | sort || echo "results_ci/ not found"
          COUNT=$(find results_ci/ -type f 2>/dev/null | wc -l)
          [ "$COUNT" -gt 0 ] || (echo "ERROR: no outputs produced" && exit 1)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fungalflow-stub-illumina
          path: results_ci/
          retention-days: 3
 
  # ── Job 3: Stub run — long reads (ONT) ────────────────────────────────────
  stub_ont:
    name: Stub — ONT long reads
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
 
      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ">=23.04.0"
 
      - name: Create stub test data
        run: |
          mkdir -p test_data
          printf '@read1\nACGTACGTACGT\n+\nIIIIIIIIIIII\n' | gzip > test_data/aspergillus_fumigatus_ont.fastq.gz
    
    # Verify file was created

      - name: FungalFlow stub — ONT mode
        run: |
          nextflow run nextflow/fungalflow/main.nf \
            -stub-run \
            --longreads 'test_data/aspergillus_fumigatus_ont.fastq.gz' \
            --sample_id 'ci_fumigatus_ont' \
            --base_outdir 'results_ci' \
            -profile fungal_env \
            2>&1 | tail -30
 
      - name: Validate outputs exist
        run: |
          COUNT=$(find results_ci/ -type f 2>/dev/null | wc -l)
          [ "$COUNT" -gt 0 ] || (echo "ERROR: no outputs produced" && exit 1)
 
 
      - name: Upload stub results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fungalflow-stub-ont
          path: results_ci/
          retention-days: 3
 
  # ── Job 4: Stub run — hybrid ───────────────────────────────────────────────
  stub_hybrid:
    name: Stub — Hybrid (Illumina + ONT)
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
 
      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ">=23.04.0"
 
      - name: Create stub test data
        run: |
          mkdir -p test_data
          printf '@r1\nACGT\n+\nIIII\n' | gzip > test_data/hybrid_R1.fastq.gz
          printf '@r1\nACGT\n+\nIIII\n' | gzip > test_data/hybrid_R2.fastq.gz
          printf '@r1\nACGTACGT\n+\nIIIIIIII\n' | gzip > test_data/hybrid_ont.fastq.gz
 
      - name: FungalFlow stub — Hybrid mode
        run: |
          nextflow run nextflow/fungalflow/main.nf \
            -stub-run \
            --shortreads 'test_data/hybrid_{R1,R2}.fastq.gz' \
            --longreads 'test_data/hybrid_ont.fastq.gz' \
            --sample_id 'ci_hybrid' \
            --base_outdir 'results_ci' \
            -profile fungal_env \
            2>&1 | tail -30
 
      - name: Validate outputs exist
        run: |
          COUNT=$(find results_ci/ -type f 2>/dev/null | wc -l)
          [ "$COUNT" -gt 0 ] || (echo "ERROR: no outputs produced" && exit 1)
 
      - name: Upload stub results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fungalflow-stub-hybrid
          path: results_ci/
          retention-days: 3