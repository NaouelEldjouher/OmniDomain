name: FungalFlow Pipeline Test

on:
  push:
    branches: [ test-fungalflow ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        
      - name: Check FungalFlow syntax
        # We must point to the specific path where your main.nf lives
        run: |
          nextflow validate nextflow/fungalflow/main.nf
          
      - name: Pipeline Dry-Run
        # This confirms that all modules/imports are correctly linked
        run: |
          nextflow run nextflow/fungalflow/main.nf -dry-run